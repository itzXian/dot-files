# MPlayer input control file
#
# vim:noet:ts=32:sts=32
#
# You are able to redefine default keyboard/joystick/mouse/LIRC bindings, or
# add new ones here.
# See DOCS/tech/slave.txt for possible commands that can be bound.
# Also see mplayer -input cmdlist for other possible options.
# The file should be placed in the $HOME/.mplayer directory.
#
# If you wish to unbind a key, use key ignore.
# e.g. ENTER ignore
#

CTRL-h	seek	-1
CTRL-l	seek	+1
h	seek	-10
l	seek	+10
H	seek	-60
L	seek	+60
CTRL-j	volume	-1
CTRL-k	volume	+1
j	volume	-10
k	volume	+10
J	volume	-60
K	volume	+60
LEFT	seek	-10
RIGHT	seek	+10
DOWN	seek	-60
UP	seek	+60
m	mute
# switch_audio / switch audio streams
=	audio_delay	0.100
-	audio_delay	-0.100
# scale playback speed
[	speed_mult	0.9091
]	speed_mult	1.1
{	speed_mult	0.5
}	speed_mult	2.0
# reset speed to normal
BS	speed_set	1.0
q	quit
CTRL-c	quit
# skip to next file
ENTER	pt_step 1 1
# advance one frame and pause
.	frame_step
SPACE	pause
HOME	pt_up_step	1
END	pt_up_step	-1
# skip to previous/next file
<	pt_step	-1
>	pt_step	1
p	pt_step	-1
n	pt_step	1
INS	alt_src_step	1
DEL	alt_src_step	-1
o	osd
# display filename in osd
I	osd_show_property_text	"${filename}"
P	osd_show_progression
# subtract/add 100 ms delay from subs
z	sub_delay	-0.1
x	sub_delay	+0.1
1	contrast	-1
2	contrast	1
3	brightness	-1
4	brightness	1
5	hue	-1
6	hue	1
7	saturation	-1
8	saturation	1
# adjust audio balance in favor of left/right
(	balance	-0.1
)	balance	+0.1
d	frame_drop
# toggle deinterlacer, requires -vf yadif or kerndeint
D	step_property	deinterlace
# move subtitles up/down
r	sub_pos	-1
t	sub_pos	+1
# immediately display previous/next subtitle
#?	sub_step	-1
#?	sub_step	+1
# decrease/increase subtitle font size
#?	sub_scale	-0.1
#?	sub_scale	+0.1
f	vo_fullscreen
# toggle video window ontop of other windows
T	vo_ontop
# zoom out/in with -panscan 0 -fs
w	panscan	-0.1
e	panscan	+0.1
# save (and append) file/stream to stream.dump with -capture
c	capturing
# take a png screenshot with -vf screenshot
# S will take a png screenshot of every frame
s	screenshot

#h	tv_step_channel	1
#l	tv_step_channel	-1
#n	tv_step_norm
#b	tv_step_chanlist

#
# Joystick section
# WARNING: joystick support has to be explicitly enabled at
#          compiletime with --enable-joystick
#

JOY_RIGHT	seek	10
JOY_LEFT	seek	-10
JOY_UP	seek	60
JOY_DOWN	seek	-60
JOY_BTN0	pause
JOY_BTN1	osd
JOY_BTN2	volume	1
JOY_BTN3	volume	-1
JOY_BTN4	set_menu	main

#
# Apple Remote section
#
# To use OSD menu with Apple Remote, set key AR_MENU to any OSD menu command,
# or just comment out the 'AR_MENU osd' line and uncomment the line after it.
#

AR_PLAY	pause
AR_PLAY_HOLD	quit
AR_NEXT	seek	30
AR_NEXT_HOLD	seek	120
AR_PREV	seek	-10
AR_PREV_HOLD	seek	-120
AR_MENU	menu	up
#AR_MENU	menu	cancel
AR_MENU_HOLD	mute
AR_VUP	volume	1
AR_VDOWN	volume	-1

#
# OSD Menu movement keys
#
# If you are using only the keyboard it is enough to define one command (like
# "menu up"), because then that single key will display the menu, which can
# then be navigated with the cursor keys and ENTER (defined in menu.conf).
#
# LIRC users should bind each "menu" command to a button on their remote.
#
# The set_menu command directly displays the (sub)menu specified as
# its argument. Usage should be self-explanatory (although not likely
# to be needed), after reading input.conf.
#

#MOUSE_BTN0	menu	up
#y	menu	down
#y	menu	ok
#y	menu	cancel
#y	menu	hide
#y	set_menu	general_pref

#
# DVDNAV
# Requires dvdnav://
#

# DVDNav UP/DOWN/LEFT/RIGHT/MENU/SELECT (ok)/DVDNav PREVIOUS menu (in the order chapter->title->root)
UP	{dvdnav}	dvdnav up
DOWN	{dvdnav}	dvdnav down
LEFT	{dvdnav}	dvdnav left
RIGHT	{dvdnav}	dvdnav right
ESC	{dvdnav}	dvdnav menu
ENTER	{dvdnav}	dvdnav select
BS	{dvdnav}	dvdnav prev

# DVDNav UP/DOWN/LEFT/RIGHT/MENU/SELECT (ok)
AR_VUP	{dvdnav}	dvdnav up
AR_VDOWN	{dvdnav}	dvdnav down
AR_PREV	{dvdnav}	dvdnav left
AR_NEXT	{dvdnav}	dvdnav right
AR_MENU	{dvdnav}	dvdnav menu
AR_PLAY	{dvdnav}	dvdnav select

# skip to previous/next dvd chapter
#?	seek_chapter	-1
#?	seek_chapter	+1

#
# Advanced seek
# Uncomment the following lines to be able to seek to n% of the media with
# the Fx keys.
#
#F1	seek	10 1
#F2	seek	20 1
#F3	seek	30 1
#F4	seek	40 1
#F5	seek	50 1
#F6	seek	60 1
#F7	seek	70 1
#F8	seek	80 1
#F9	seek	90 1
#
# Use - to combine multiple keys into a key combination
#
CTRL-.	osd_show_property_text	"Playing: ${filename}"
