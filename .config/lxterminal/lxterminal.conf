[general]
fontname=Iosevka Fixed SS09 10
selchars=-A-Za-z0-9,./?%&#:_
scrollback=4096
bgcolor=rgba(39,42,52,0.8)
fgcolor=rgb(255,255,255)
palette_color_0=rgb(0,0,0)
palette_color_1=rgb(255,67,67)
palette_color_2=rgb(81,221,170)
palette_color_3=rgb(255,158,128)
palette_color_4=rgb(118,106,255)
palette_color_5=rgb(190,37,190)
palette_color_6=rgb(49,200,255)
palette_color_7=rgb(211,215,207)
palette_color_8=rgb(127,127,127)
palette_color_9=rgb(255,128,128)
palette_color_10=rgb(113,255,204)
palette_color_11=rgb(255,204,128)
palette_color_12=rgb(178,171,255)
palette_color_13=rgb(254,125,254)
palette_color_14=rgb(128,240,255)
palette_color_15=rgb(255,255,255)
color_preset=Custom
disallowbold=false
cursorblinks=true
cursorunderline=false
audiblebell=false
tabpos=left
