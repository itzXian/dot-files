# Config of Picom
# vim:noet:ts=32:sts=32
# See /etc/xdg/picom.conf
# and /etc/xdg/picom.conf.example
# for more details.

corner-radius = 10;
rounded-corners-exclude = [
  #"window_type = 'normal'",
  "class_g = 'i3bar'",
];
round-borders = 10;
round-borders-exclude = [
  "class_g = 'TelegramDesktop'",
];

backend	= "glx";

glx-no-stencil	= true;
glx-copy-from-front	= false;

shadow	= true;
#shadow-radius	= 5;
#shadow-offset-x	= 1;
#shadow-offset-y	= 1;
shadow-opacity	= 0.8;

shadow-exclude = [
  "! name ~= ''",
  "name  = 'Notification'",
  "name  *= 'qiv'",
  "name  = 'Plank'",
  "name  = 'Docky'",
  "name  = 'Kupfer'",
  "name  = 'xfce4-notifyd'",
  "name *= 'compton'",
  "name *= 'picom'",
  "class_g  = 'Conky'",
  "class_g  = 'Kupfer'",
  "class_g  = 'Synapse'",
  "class_g ?= 'Notify-osd'",
  "class_g ?= 'Cairo-dock'",
  "class_g ?= 'Xfce4-notifyd'",
  "class_g ?= 'Xfce4-power-manager'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];
shadow-ignore-shaped	= true;

inactive-opacity	= 1;
active-opacity	= 1;
frame-opacity	= 1;
inactive-opacity-override	= false;
opacity-rule   = [
  "0:_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "75:class_g *?= 'Rofi'",
  "88:class_g  = 'URxvt'",
  "88:class_g  = 'qgit'",
  "88:class_g  = 'qgit4'",
  "88:class_g  = 'fcitx'",
  "88:class_g  = 'rofi'",
  "88:class_g  = 'Fcitx-config-gtk3'",
  "88:class_g  = 'minecraft-launcher'",
  "88:class_g  = 'Xarchiver'",
  "88:class_g  = 'TelegramDesktop'",
  "88:class_g  = 'Steam'",
  "88:class_g  = 'SimpleScreenRecorder'",
  "88:class_g  = 'Dunst'",
  "88:class_g *= 'Ibus'",
  "88:class_g *= 'org-jd-gui-App'",
  "88:class_g *= 'Nm-connection-editor'",
  "88:class_g *= 'Nm-applet'",
  "88:class_g *= 'Blueman-'",
  "88:class_g *= 'Nemo'",
  "88:class_g *= 'qt5ct'",
  "88:class_g *= 'Pcmanfm'",
  "88:class_g *= 'pcmanfm-qt'",
  "88:class_g  = 'Giggle'"
];

blur-method	= "dual_kawase";
blur-strength	= 10;
blur-background-frame	= false;
blur-background	= false;
blur-background-fixed	= false;
blur-background-exclude = [
  "class_g *= 'firefox'"
];

fading	= true;
fade-delta	= 4;
fade-in-step	= 0.06;
fade-out-step	= 0.06;
fade-exclude = [ ];

mark-wmwin-focused	= true;
mark-ovredir-focused	= true;
use-ewmh-active-win	= true;
detect-rounded-corners	= true;
detect-client-opacity	= true;
refresh-rate	= 60;
vsync	= true;
dbe	= false;

unredir-if-possible	= false;
focus-exclude	= [ ];
detect-transient	= true;
detect-client-leader	= true;

wintypes: {
  desktop       = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  dock          = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  toolbar       = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  menu          = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  utility       = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  splash        = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  dialog        = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  normal        = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  dropdown_menu = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  popup_menu    = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  tooltip       = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  notification  = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  combo         = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;  opacity = 0.96;  focus = true;  };
  dnd           = { fade = true;  shadow = true;  full-shadow = true;  clip-shadow = true;                   focus = true;  };
};

xrender-sync-fence	= true;
